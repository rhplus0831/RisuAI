name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  check-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:server

  frontend-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:test-inventories

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # When the focused coverage job runs, let it own these six UI test files
      # instead of executing them a second time in the ordinary frontend lane.
      RISU_TEST_EXCLUDE_UI_MAP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:frontend:run

  initial-preload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:initial-preload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-preload-report
          path: |
            fast-bootstrap-results/initial-preload.*
            fast-bootstrap-results/bundle-boundaries.*
          if-no-files-found: error

  gates-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:gates:perf --no-file-parallelism --maxWorkers=1

  ui-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage:ui-map
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-coverage
          path: coverage/ui-map
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:server

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: |
            test-results
            fast-bootstrap-results/startup-matrix.*
          if-no-files-found: ignore

  verify:
    if: always()
    needs:
      - format
      - check
      - check-server
      - frontend-routing
      - frontend
      - initial-preload
      - gates-perf
      - ui-coverage
      - server
      - smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality lane
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CHECK_SERVER_RESULT: ${{ needs['check-server'].result }}
          FRONTEND_ROUTING_RESULT: ${{ needs['frontend-routing'].result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          INITIAL_PRELOAD_RESULT: ${{ needs['initial-preload'].result }}
          GATES_PERF_RESULT: ${{ needs['gates-perf'].result }}
          UI_COVERAGE_RESULT: ${{ needs['ui-coverage'].result }}
          SERVER_RESULT: ${{ needs.server.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          test "$FORMAT_RESULT" = success
          test "$CHECK_RESULT" = success
          test "$CHECK_SERVER_RESULT" = success
          test "$FRONTEND_ROUTING_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$INITIAL_PRELOAD_RESULT" = success
          test "$GATES_PERF_RESULT" = success
          test "$SERVER_RESULT" = success
          test "$SMOKE_RESULT" = success
          test "$UI_COVERAGE_RESULT" = success
